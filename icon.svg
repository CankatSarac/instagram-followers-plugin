<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Instagram gradient -->
    <linearGradient id="instagramGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#833ab4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fd1d1d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fcb045;stop-opacity:1" />
    </linearGradient>
    
    <!-- Detective accent -->
    <radialGradient id="detectiveGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background circle with Instagram gradient -->
  <circle cx="64" cy="64" r="58" fill="url(#instagramGradient)" stroke="#333" stroke-width="2"/>
  
  <!-- Detective magnifying glass -->
  <g transform="translate(64, 64)">
    <!-- Magnifying glass lens -->
    <circle cx="-8" cy="-8" r="18" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.9"/>
    <circle cx="-8" cy="-8" r="15" fill="rgba(255,255,255,0.1)" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Magnifying glass handle -->
    <line x1="8" y1="8" x2="22" y2="22" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    
    <!-- Instagram camera icon inside lens -->
    <g transform="translate(-8, -8) scale(0.6)">
      <rect x="-8" y="-6" width="16" height="12" rx="3" fill="none" stroke="#ffffff" stroke-width="2"/>
      <circle cx="0" cy="0" r="4" fill="none" stroke="#ffffff" stroke-width="2"/>
      <circle cx="4" cy="-4" r="1" fill="#ffffff"/>
    </g>
  </g>
  
  <!-- Detective hat accent -->
  <g transform="translate(64, 30)">
    <ellipse cx="0" cy="0" rx="25" ry="8" fill="#2c2c2c" opacity="0.8"/>
    <rect x="-20" y="-5" width="40" height="8" rx="2" fill="#2c2c2c" opacity="0.8"/>
  </g>
  
  <!-- Subtle glow effect -->
  <circle cx="64" cy="64" r="58" fill="url(#detectiveGlow)"/>
  
  <!-- Unfollower indicator dots -->
  <g opacity="0.7">
    <circle cx="30" cy="45" r="3" fill="#ff4444"/>
    <circle cx="98" cy="55" r="3" fill="#ff4444"/>
    <circle cx="35" cy="85" r="3" fill="#ff4444"/>
  </g>
</svg>